dir: local
	path /var/lib/vz
	content import,iso,vztmpl,snippets
	shared 0

lvmthin: local-lvm
	thinpool data
	vgname pve
	content rootdir,images

dir: backup-disk
	path /mnt/pve/backup-disk
	content backup
	is_mountpoint 1
	nodes pve
	shared 0

dir: disk-NAS
	path /mnt/pve/disk-NAS
	content images,iso,backup

dir: disk-KFC
	path /mnt/pve/disk-KFC
	content images,iso,backup

dir: disk-PFK
	path /mnt/pve/disk-PFK
	content images,iso,backup

dir: disk-EXOS
	path /mnt/pve/disk-EXOS
	content iso,images,backup

