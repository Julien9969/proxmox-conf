arch: amd64
cores: 1
features: nesting=1,keyctl=1
hostname: wireguard
memory: 256
net0: name=eth0,bridge=vmbr0,hwaddr=BC:24:11:84:82:A7,ip=dhcp,type=veth
onboot: 1
ostype: alpine
rootfs: local-lvm:vm-104-disk-0,size=1G
swap: 512
tags: community-script;network;vpn
timezone: Europe/Paris
unprivileged: 1
